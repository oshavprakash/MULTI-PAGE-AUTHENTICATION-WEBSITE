<!DOCTYPE html>
<html>
<head>
    <title>Sign-Up Page</title>
    <link rel="stylesheet" href="logincss.css">
</head>
<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
    <div class="container">
        <div class="login-card">
            <h1>Sign Up</h1>
            <p>Get Started</p>
            <center>
                <p>Create an account to stay updated on Newest Projects</p>
            </center>
            <form>
                <input type="text" placeholder="Set User Name">
                <div class="password-box">
                    <input type="password" placeholder="Set Password">
                    <i class="fa-solid fa-eye-slash"></i>
                </div>
                <div class="remember">
                    <input type="checkbox">
                    <label>Remember me</label>
                </div>
                <button class="signin" onclick="alert('Account created successfully!')">Save</button>
                <a href="login.html"><button type="button" class="signup">Sign In </button></a>
            </form>
        </div>
        <div class="content">
            <h1>
                Secure workspaces
                <span>engineered</span>
                <span>for clarity.</span>
            </h1>
            <p>
                Manage your safety with intuitive controls and
                real-time insights. Provide your core system
                definitions and manage engineered applications.
            </p>
        </div>

    </div>

</body>
</html>
