<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="logincss.css">
</head>
<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
    <div class="container">
        <div class="login-card">
            <h1>Welcome back</h1>
            <p>
                Secure, modern workspaces with built-in
                clarity and safety.
            </p>
            <form>
                <input type="text" placeholder="User Name">
                <div class="password-box">
                    <input type="password" placeholder="Password">
                    <i class="fa-solid fa-eye-slash"></i>
                </div>
                <div class="remember">
                    <input type="checkbox">
                    <label>Remember me</label>
                    <a href="forgotpassword.html">Forgot Password</a>
                </div>
                
                <button class="signin" type="button" onclick="window.location.href='home.html'">Sign In</button>
                <a href="signup.html"><button type="button" class="signup">Sign Up</button></a>
                </form>
        </div>
        <div class="content">
            <h1>
                Secure workspaces
                <span>engineered</span>
                <span>for clarity.</span>
            </h1>
            <p>
                Manage your safety with intuitive controls and
                real-time insights. Provide your core system
                definitions and manage engineered applications.
            </p>
        </div>

    </div>

</body>
</html>
